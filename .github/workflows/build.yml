name: Build BrawlHook Automatically

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Include Paths Automatically
        run: |
          echo "Fixing relative paths for header files..."
          # تعديل مسارات الأوفستس في كل ملفات الـ features والـ hooks لتطابق مكانها الصحيح
          find features/ hooks/ -name "*.h" -o -name "*.cpp" | xargs sed -i 's|\.\./\.\./game/offsets_69252\.h|game/offsets_69252.h|g'

      - name: Download and Setup Android NDK
        run: |
          echo "Downloading Android NDK r27..."
          wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28 \
                ..

      - name: Build with Make
        run: |
          cd build
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brawlhook-so
          path: build/libbrawlhook.so
